[workspace]
resolver = "2"
members = [
    "crates/chordworld_core",
    "crates/chordworld_dsp",
    "crates/chordworld_world",
    "crates/chordworld_engine",
    "crates/chordworld_tui",
    "crates/chordworld_app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["CHORDWORLD"]

[workspace.dependencies]
# Core crates
chordworld_core = { path = "crates/chordworld_core" }
chordworld_dsp = { path = "crates/chordworld_dsp" }
chordworld_world = { path = "crates/chordworld_world" }
chordworld_engine = { path = "crates/chordworld_engine" }
chordworld_tui = { path = "crates/chordworld_tui" }

# Audio
cpal = "0.15"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Serialization
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"

# Utilities
blake3 = "1.5"
ringbuf = "0.4"
crossbeam-channel = "0.5"
smallvec = "1.13"
thiserror = "1.0"
anyhow = "1.0"

# WAV export
hound = "3.5"
